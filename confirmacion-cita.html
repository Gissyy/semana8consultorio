<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Confirmación de cita</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>

	<body class="bg-light">
		<main class="container py-4">
			<div class="row justify-content-center">
				<div class="col-12 col-md-8 col-lg-6">
					<div class="card shadow-sm">
						<div class="card-body">
							<h1 class="h3 mb-4">Resumen de solicitud</h1>

							<!-- SOLICITUD -->
							<div id="contenidoSolicitud">
								<p>
									<strong>Nombre:</strong>
									<span id="nombre"></span>
								</p>

								<p>
									<strong>Correo:</strong>
									<span id="correo"></span>
								</p>

								<p>
									<strong>Especialidad:</strong>
									<span id="especialidad"></span>
								</p>

								<p>
									<strong>Fecha:</strong>
									<span id="fecha"></span>
								</p>

								<p>
									<strong>Horario:</strong>
									<span id="horario"></span>
								</p>

								<div class="alert alert-info mt-4">
									Esta página muestra únicamente el resumen de
									la solicitud. No confirma una cita real.
								</div>

								<a href="index.html" class="btn btn-secondary">
									Corregir solicitud
								</a>
							</div>

							<!-- SIN DATOS -->
							<div
								id="sinSolicitud"
								class="alert alert-warning d-none"
							>
								<p>No existe información de una solicitud.</p>

								<a href="index.html" class="btn btn-primary">
									Volver al formulario
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script src="js/confirmacion.js"></script>
	</body>
</html>

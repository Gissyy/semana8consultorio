<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Solicitud de cita</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>

	<body class="bg-light">
		<main class="container py-4">
			<div class="row justify-content-center">
				<div class="col-12 col-md-8 col-lg-6">
					<div class="card shadow-sm">
						<div class="card-body">
							<h1 class="h3 mb-3">Solicitud de cita</h1>

							<p class="text-muted">Consultorio Salud Centro</p>

							<form id="formCita">
								<!-- NOMBRE -->
								<div class="mb-3">
									<label for="nombre" class="form-label">
										Nombre
									</label>

									<input
										type="text"
										id="nombre"
										class="form-control"
										minlength="3"
										maxlength="60"
										required
									/>

									<div
										id="errorNombre"
										class="text-danger small"
									></div>
								</div>

								<!-- CORREO -->
								<div class="mb-3">
									<label for="correo" class="form-label">
										Correo
									</label>

									<input
										type="email"
										id="correo"
										class="form-control"
										required
									/>

									<div
										id="errorCorreo"
										class="text-danger small"
									></div>
								</div>

								<!-- FECHA -->
								<div class="mb-3">
									<label for="fecha" class="form-label">
										Fecha
									</label>

									<input
										type="date"
										id="fecha"
										class="form-control"
										required
									/>

									<div
										id="errorFecha"
										class="text-danger small"
									></div>
								</div>

								<!-- ESPECIALIDAD -->
								<div class="mb-3">
									<label
										for="especialidad"
										class="form-label"
									>
										Especialidad
									</label>

									<select
										id="especialidad"
										class="form-select"
										required
									>
										<option value="">Seleccione</option>

										<option value="Consulta general">
											Consulta general
										</option>

										<option value="Odontología">
											Odontología
										</option>

										<option value="Nutrición">
											Nutrición
										</option>
									</select>

									<div
										id="errorEspecialidad"
										class="text-danger small"
									></div>
								</div>

								<!-- HORARIO -->
								<div class="mb-3">
									<label for="horario" class="form-label">
										Horario
									</label>

									<select
										id="horario"
										class="form-select"
										required
									>
										<option value="">
											Seleccione un horario
										</option>
									</select>

									<div
										id="mensajeHorarios"
										class="text-muted small mt-1"
									></div>

									<div
										id="errorHorario"
										class="text-danger small"
									></div>
								</div>

								<button
									type="submit"
									class="btn btn-primary w-100"
								>
									Enviar solicitud
								</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script src="js/cita.js"></script>
	</body>
</html>
